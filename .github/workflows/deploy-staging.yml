name: Deploy to Staging

# Fires only after CI has already passed on develop (workflow_run waits for
# the CI workflow to complete successfully on this exact commit) — this is
# what guarantees a red test run can never reach staging.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [develop]
    types: [completed]

permissions:
  id-token: write   # required for OIDC -> AWS role assumption, no stored AWS keys
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging  # ties this to GitHub's "staging" environment — set required reviewers/secrets there if desired

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Build
        run: npm run build

      # ── AWS auth via OIDC — replace the role ARN below once it exists.
      # This role needs (at minimum): ecr:GetAuthorizationToken,
      # ecr:BatchCheckLayerAvailability, ecr:PutImage for pushing the image,
      # and ecs:UpdateService / ecs:DescribeServices for the deploy step.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        working-directory: .
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: knockit-api-staging
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f apps/api/Dockerfile .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # Migrations run as a ONE-OFF task against the staging RDS instance,
      # separate from the long-running API service — never let app startup
      # silently run migrations, since that makes rollback and multi-instance
      # deploys unsafe (two containers booting simultaneously would both try
      # to run the same migration).
      - name: Run database migrations on staging
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          aws ecs run-task \
            --cluster knockit-staging-cluster \
            --task-definition knockit-api-migrate-staging \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.STAGING_PRIVATE_SUBNET_IDS }}],securityGroups=[${{ secrets.STAGING_SECURITY_GROUP_ID }}]}" \
            --overrides "{\"containerOverrides\":[{\"name\":\"migrate\",\"command\":[\"npm\",\"run\",\"migration:run:prod\"]}]}"

      - name: Deploy new image to ECS service
        run: |
          aws ecs update-service \
            --cluster knockit-staging-cluster \
            --service knockit-api-staging \
            --force-new-deployment

      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster knockit-staging-cluster \
            --services knockit-api-staging

      - name: Verify staging health endpoint
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://staging.knockit.app/api/v1/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Staging is healthy"
              exit 0
            fi
            echo "Attempt $i: got HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "Staging health check failed after deploy"
          exit 1
