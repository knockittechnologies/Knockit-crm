name: knockit-dev

services:
  # ───────────────────────── PostgreSQL ─────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: knockit-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: knockit
      POSTGRES_PASSWORD: knockit_dev_password
      POSTGRES_DB: knockit_crm_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knockit"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ───────────────────────── Redis (queues, cache, sessions) ─────────────────────────
  redis:
    image: redis:7-alpine
    container_name: knockit-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ───────────────────────── MinIO (S3-compatible local file storage) ─────────────────────────
  minio:
    image: minio/minio:latest
    container_name: knockit-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_dev_data:/data

  # ───────────────────────── Adminer (DB GUI, optional but handy) ─────────────────────────
  adminer:
    image: adminer:latest
    container_name: knockit-adminer-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  # ───────────────────────── NestJS API (hot reload) ─────────────────────────
  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile.dev
    container_name: knockit-api-dev
    restart: unless-stopped
    env_file:
      - ../../apps/api/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "3000:3000"
    volumes:
      - ../../apps/api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_dev_data:
  redis_dev_data:
  minio_dev_data:
  api_node_modules:
